# Deploy portfolio site to GitHub Pages (mirror target for GitLab push mirror).
#
# Site URL and base path are auto-detected in astro.config.mjs from
# GITHUB_REPOSITORY / GITHUB_REPOSITORY_OWNER when GITHUB_ACTIONS=true.
# Project pages: https://<owner>.github.io/<repo>/
# User/org pages (repo named <owner>.github.io): https://<owner>.github.io/
#
# GitHub repo settings: Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install font subsetting tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install fonttools brotli

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: |
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER}"
          bun run build
          test -f dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
