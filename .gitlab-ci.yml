image: node:22-bookworm

variables:
  HUSKY: '0'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .bun/

pages:
  stage: deploy
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv curl git ca-certificates
    - python3 -m venv .venv
    - .venv/bin/pip install -q fonttools brotli
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:.venv/bin:$PATH"
  script:
    - bun install --frozen-lockfile
    - |
      if [ -n "$CI_PAGES_URL" ]; then
        export SITE_URL="${CI_PAGES_URL%/}"
        export SITE_BASE="$(node -p "const p=new URL(process.env.CI_PAGES_URL).pathname; !p || p==='/' ? '/' : p.endsWith('/') ? p : p + '/'")"
      else
        export SITE_BASE="/${CI_PROJECT_NAME}/"
        export SITE_URL="https://${CI_PROJECT_ROOT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}"
      fi
      echo "SITE_URL=${SITE_URL}"
      echo "SITE_BASE=${SITE_BASE}"
    - bun run build
    - test -f dist/index.html
  pages:
    publish: dist
  artifacts:
    paths:
      - dist
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
